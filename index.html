<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Таро Расклад</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a1a; /* Темный фон, если bg.jpg не загрузится */
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h3 { text-shadow: 2px 2px 4px rgba(0,0,0,0.8); margin-bottom: 20px; text-transform: uppercase; }

        .grid {
            display: grid;
            grid-template-columns: repeat(6, 45px);
            gap: 15px 10px;
            justify-content: center;
        }

        .card-container {
            width: 90px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            grid-column: span 2;
        }

        .card-container:nth-child(4) { grid-column: 2 / 4; }
        .card-container:nth-child(5) { grid-column: 4 / 6; }

        .card-container.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .card-front {
            background: url('backnew.jpg') no-repeat center center;
            background-size: cover;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #000;
            background-size: contain; /* Чтобы карта не обрезалась */
            background-repeat: no-repeat;
            background-position: center;
            border: 2px solid gold;
            display: flex;
            align-items: flex-end;
        }

        .card-name-tag {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 10px;
            width: 100%;
            text-align: center;
            padding: 5px 0;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        #confirm-btn {
            display: none;
            margin-top: 30px;
            padding: 15px 50px;
            background: linear-gradient(135deg, #6e45e2 0%, #a485ff 100%);
            border: none;
            color: white;
            border-radius: 30px;
            font-weight: bold;
        }

        .locked { opacity: 0.5; pointer-events: none; filter: grayscale(0.5); }
    </style>
</head>
<body>

    <h3>ВЫБЕРИТЕ 3 КАРТЫ</h3>
    <div class="grid" id="grid"></div>
    <button id="confirm-btn">ПОДТВЕРДИТЬ ВЫБОР</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // НОВЫЙ ПУТЬ К ПАПКЕ PUBLIC
        const imgBase = "https://raw.githubusercontent.com/LindseyB/tarot-api/master/public/cards/";

        const deck = [];
        
        // 1. Старшие Арканы (названия как на скрине)
        const majors = [
            { n: "Шут", f: "TheFool" }, { n: "Маг", f: "TheMagician" }, { n: "Жрица", f: "TheHighPriestess" },
            { n: "Императрица", f: "TheEmpress" }, { n: "Император", f: "TheEmperor" }, { n: "Иерофант", f: "TheHierophant" },
            { n: "Влюбленные", f: "TheLovers" }, { n: "Колесница", f: "TheChariot" }, { n: "Сила", f: "Strength" },
            { n: "Отшельник", f: "TheHermit" }, { n: "Колесо Фортуны", f: "WheelOfFortune" }, { n: "Справедливость", f: "Justice" },
            { n: "Повешенный", f: "TheHangedMan" }, { n: "Смерть", f: "Death" }, { n: "Умеренность", f: "Temperance" },
            { n: "Дьявол", f: "TheDevil" }, { n: "Башня", f: "TheTower" }, { n: "Звезда", f: "TheStar" },
            { n: "Луна", f: "TheMoon" }, { n: "Солнце", f: "TheSun" }, { n: "Суд", f: "Judgement" }, { n: "Мир", f: "TheWorld" }
        ];
        majors.forEach(m => deck.push({ name: m.n, img: m.f + ".png" }));

        // 2. Младшие Арканы (Wands01.png, Cups01.png и т.д.)
        const suits = [
            { id: "Wands", ru: "Жезлов" }, { id: "Cups", ru: "Кубков" }, 
            { id: "Swords", ru: "Мечей" }, { id: "Pentacles", ru: "Пентаклей" }
        ];
        const ranks = ["Туз", "02", "03", "04", "05", "06", "07", "08", "09", "10", "11", "12", "13", "14"];
        const rankNames = ["Туз", "2", "3", "4", "5", "6", "7", "8", "9", "10", "Паж", "Рыцарь", "Королева", "Король"];

        suits.forEach(suit => {
            ranks.forEach((rank, index) => {
                deck.push({
                    name: `${rankNames[index]} ${suit.ru}`,
                    img: `${suit.id}${rank}.png`
                });
            });
        });

        // Перемешивание
        const shuffled = deck.sort(() => 0.5 - Math.random()).slice(0, 5);
        let selected = [];
        const grid = document.getElementById('grid');
        const btn = document.getElementById('confirm-btn');

        shuffled.forEach(card => {
            const container = document.createElement('div');
            container.className = 'card-container';
            container.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-face card-back" style="background-image: url('${imgBase + card.img}')">
                    <div class="card-name-tag">${card.name}</div>
                </div>
            `;
            container.onclick = () => {
                if (selected.length < 3 && !container.classList.contains('flipped')) {
                    container.classList.add('flipped');
                    selected.push(card.name);
                    if (selected.length === 3) {
                        btn.style.display = 'block';
                        document.querySelectorAll('.card-container:not(.flipped)').forEach(c => c.classList.add('locked'));
                    }
                }
            };
            grid.appendChild(container);
        });

        btn.onclick = async () => {
            btn.disabled = true;
            btn.innerText = "ОТПРАВКА...";
            const userId = tg.initDataUnsafe?.user?.id || "test_user";
            // Твой скрипт из image_e3a84a.png
            const scriptURL = "https://script.google.com/macros/s/AKfycbyD0tPoh7h1YNWAiASIyux-FiQKGO6aZidwS7ltlk991ve1_NGJpoPF46IuUp6maDbJ/exec";
            
            try {
                await fetch(`${scriptURL}?user_id=${userId}&cards=${encodeURIComponent(selected.join(", "))}`, { mode: 'no-cors' });
                tg.close();
            } catch(e) {
                btn.disabled = false;
                btn.innerText = "ПОДТВЕРДИТЬ ВЫБОР";
            }
        };
    </script>
</body>
</html>
