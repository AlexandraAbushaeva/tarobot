<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Таро Расклад</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h3 { text-shadow: 2px 2px 4px rgba(0,0,0,0.8); margin-bottom: 20px; text-transform: uppercase; }

        /* Сетка 3 + 2 */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 45px);
            gap: 15px 10px;
            justify-content: center;
        }

        .card-container {
            width: 90px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            grid-column: span 2;
        }

        /* Выравнивание 2-го ряда */
        .card-container:nth-child(4) { grid-column: 2 / 4; }
        .card-container:nth-child(5) { grid-column: 4 / 6; }

        .card-container.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .card-front {
            background: url('back.jpg') no-repeat center center;
            background-size: cover;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #1a1a1a;
            background-size: 100% 100%;
            background-position: center;
            border: 2px solid gold;
            display: flex;
            align-items: flex-end;
        }

        .card-name-tag {
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            font-size: 10px;
            width: 100%;
            text-align: center;
            padding: 5px 0;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        #confirm-btn {
            display: none;
            margin-top: 30px;
            padding: 15px 50px;
            background: linear-gradient(135deg, #6e45e2 0%, #a485ff 100%);
            border: none;
            color: white;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(110, 69, 226, 0.5);
        }

        .locked { opacity: 0.5; pointer-events: none; filter: grayscale(0.5); }
    </style>
</head>
<body>

    <h3>ВЫБЕРИТЕ 3 КАРТЫ</h3>
    <div class="grid" id="grid"></div>
    <button id="confirm-btn">ПОДТВЕРДИТЬ ВЫБОР</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Ссылка на картинки из твоего репозитория LindseyB
        const imgBase = "https://raw.githubusercontent.com/LindseyB/tarot-api/master/static/img/";

        const deck = [];
        
        // 1. Старшие Арканы (m00.jpg - m21.jpg)
        const majorNames = ["Шут", "Маг", "Жрица", "Императрица", "Император", "Иерофант", "Влюбленные", "Колесница", "Сила", "Отшельник", "Колесо Фортуны", "Справедливость", "Повешенный", "Смерть", "Умеренность", "Дьявол", "Башня", "Звезда", "Луна", "Солнце", "Суд", "Мир"];
        majorNames.forEach((name, i) => {
            let fileName = "m" + i.toString().padStart(2, '0') + ".jpg";
            deck.push({ name: name, img: fileName });
        });

        // 2. Младшие Арканы (w01.jpg, c01.jpg и т.д.)
        const suits = [
            { id: "w", ru: "Жезлов" }, { id: "c", ru: "Кубков" }, 
            { id: "s", ru: "Мечей" }, { id: "p", ru: "Пентаклей" }
        ];
        const rankNames = ["Туз", "2", "3", "4", "5", "6", "7", "8", "9", "10", "Паж", "Рыцарь", "Королева", "Король"];

        suits.forEach(suit => {
            for(let i=1; i<=14; i++) {
                let fileName = suit.id + i.toString().padStart(2, '0') + ".jpg";
                deck.push({
                    name: `${rankNames[i-1]} ${suit.ru}`,
                    img: fileName
                });
            }
        });

        // Перемешиваем и берем 5 карт
        const shuffled = deck.sort(() => 0.5 - Math.random()).slice(0, 5);
        let selected = [];
        const grid = document.getElementById('grid');
        const btn = document.getElementById('confirm-btn');

        shuffled.forEach(card => {
            const container = document.createElement('div');
            container.className = 'card-container';
            container.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-face card-back" style="background-image: url('${imgBase + card.img}')">
                    <div class="card-name-tag">${card.name}</div>
                </div>
            `;
            container.onclick = () => {
                if (selected.length < 3 && !container.classList.contains('flipped')) {
                    container.classList.add('flipped');
                    selected.push(card.name);
                    if (selected.length === 3) {
                        btn.style.display = 'block';
                        document.querySelectorAll('.card-container:not(.flipped)').forEach(c => c.classList.add('locked'));
                    }
                }
            };
            grid.appendChild(container);
        });

        btn.onclick = async () => {
            btn.disabled = true;
            btn.innerText = "СОХРАНЯЕМ...";
            const userId = tg.initDataUnsafe?.user?.id || "test_user";
            const scriptURL = "https://script.google.com/macros/s/AKfycbyD0tPoh7h1YNWAiASIyux-FiQKGO6aZidwS7ltlk991ve1_NGJpoPF46IuUp6maDbJ/exec";
            
            try {
                await fetch(`${scriptURL}?user_id=${userId}&cards=${encodeURIComponent(selected.join(", "))}`, { mode: 'no-cors' });
                tg.close();
            } catch(e) {
                btn.disabled = false;
                btn.innerText = "ПОДТВЕРДИТЬ ВЫБОР";
            }
        };
    </script>
</body>
</html>
