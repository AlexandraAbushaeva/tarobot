<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #1a1a1a; color: white; }
        .grid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 350px; }
        .card { 
            width: 80px; height: 110px; background: #333; border: 1px solid #555;
            display: flex; align-items: center; justify-content: center; border-radius: 8px; 
            cursor: pointer; font-size: 11px; text-align: center; transition: 0.2s;
        }
        /* Стиль для выбранной карты (без возможности отмены) */
        .card.selected { 
            background: #5c43f5; 
            border-color: #fff; 
            transform: scale(1.05); 
            cursor: default; /* меняем курсор, чтобы было понятно, что кликать больше нельзя */
        }
        #status { margin-top: 20px; color: #888; font-size: 13px; height: 20px; }
    </style>
</head>
<body>

    <h3 id="title">ВЫБЕРИТЕ 3 КАРТЫ</h3>
    <div class="grid" id="grid"></div>
    <div id="status">Загрузка...</div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ОБЯЗАТЕЛЬНО: Вставь сюда свою ссылку после развертывания скрипта
        const scriptURL = "ТВОЙ_URL_СКРИПТА"; 
        const userId = tg.initDataUnsafe?.user?.id || "test_user";
        
        const names = ["Маг", "Жрица", "Императрица", "Император", "Жрец", "Влюбленные", "Колесница"];
        let selected = [];

        // Очищаем старые данные при входе
        window.onload = () => {
            fetch(`${scriptURL}?user_id=${userId}&action=clear`, { mode: 'no-cors' });
            document.getElementById('status').innerText = "Сделайте свой выбор";
        };

        const grid = document.getElementById('grid');
        names.forEach(name => {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerText = "Карта";
            
            el.onclick = async () => {
                // Если карта уже выбрана — просто игнорируем клик (отмена запрещена)
                if (selected.includes(name)) return;

                // Если в списке меньше 3-х карт — добавляем
                if (selected.length < 3) {
                    selected.push(name);
                    el.classList.add('selected');
                    el.innerText = name; // Показываем название выбранной карты

                    // Как только стало 3 — отправляем результат
                    if (selected.length === 3) {
                        sendResult();
                    }
                }
            };
            grid.appendChild(el);
        });

        async function sendResult() {
            document.getElementById('title').innerText = "ВЫБОР ПРИНЯТ";
            document.getElementById('status').innerText = "Сохраняем...";
            grid.style.pointerEvents = "none"; // полностью блокируем всё поле
            
            const cards = selected.join(", ");
            try {
                await fetch(`${scriptURL}?user_id=${userId}&cards=${encodeURIComponent(cards)}`, { mode: 'no-cors' });
                document.getElementById('status').innerText = "Готово! Закрываем...";
                setTimeout(() => tg.close(), 700);
            } catch (e) {
                document.getElementById('title').innerText = "ОШИБКА СЕТИ";
                grid.style.pointerEvents = "auto";
            }
        }
    </script>
</body>
</html>
