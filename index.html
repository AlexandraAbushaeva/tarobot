<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Таро Расклад</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            background: #1a1a1a; 
            color: white;
            overflow: hidden;
        }
        h3 { margin-bottom: 20px; font-weight: 300; letter-spacing: 1px; }
        .grid { 
            display: flex; 
            gap: 12px; 
            flex-wrap: wrap; 
            justify-content: center; 
            max-width: 350px; 
            margin-bottom: 30px;
        }
        .card { 
            width: 80px; 
            height: 120px; 
            background: #2c2c2c; 
            border: 1px solid #444;
            color: #ccc; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 12px; 
            text-align: center; 
            padding: 5px; 
            transition: all 0.3s ease;
        }
        .card.selected { 
            background: #4a34db; 
            border-color: #7f6cf5; 
            color: white;
            transform: translateY(-5px);
        }
        /* Стиль кнопки Подтвердить */
        #confirm-btn {
            display: none; /* Скрыта в начале */
            width: 200px;
            padding: 15px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .status { margin-top: 15px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <h3 id="title">ВЫБЕРИТЕ 3 КАРТЫ</h3>
    <div class="grid" id="grid"></div>
    
    <button id="confirm-btn">ПОДТВЕРДИТЬ</button>
    
    <div class="status" id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const names = ["Маг", "Жрица", "Императрица", "Император", "Жрец", "Влюбленные", "Колесница"];
        let selectedCards = [];
        
        const grid = document.getElementById('grid');
        const title = document.getElementById('title');
        const status = document.getElementById('status');
        const confirmBtn = document.getElementById('confirm-btn');

        const scriptURL = "https://script.google.com/macros/s/AKfycbwlBfanHKtJXvbdx9JvdLyLfbpoxbfi0J0PKDhTsn6S8shDXXcuHLuDnxDsyLJAWp7gbA/exec";

        // Создаем карты
        names.forEach(name => {
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.innerText = "Клеймо Таро";
            
            cardElement.onclick = () => {
                // Если уже выбрали 3, клики по другим не работают
                if (selectedCards.length >= 3 && !selectedCards.includes(name)) return;

                if (selectedCards.includes(name)) {
                    // Отмена выбора (если хочешь запретить — просто удали этот блок)
                    selectedCards = selectedCards.filter(item => item !== name);
                    cardElement.classList.remove('selected');
                    cardElement.innerText = "Клеймо Таро";
                } else {
                    selectedCards.push(name);
                    cardElement.classList.add('selected');
                    cardElement.innerText = name;
                }

                // Показываем кнопку, если выбрано ровно 3
                if (selectedCards.length === 3) {
                    confirmBtn.style.display = 'block';
                } else {
                    confirmBtn.style.display = 'none';
                }
            };
            grid.appendChild(cardElement);
        });

        // Нажатие на "Подтвердить"
        confirmBtn.onclick = async () => {
            await sendData();
        };

        async function sendData() {
            const userId = tg.initDataUnsafe?.user?.id || "test_user";
            const cardsString = selectedCards.join(", ");
            
            confirmBtn.disabled = true;
            confirmBtn.innerText = "ОТПРАВКА...";
            grid.style.pointerEvents = "none";

            try {
                // Вот здесь летит вебхук, который записывает данные
                await fetch(`${scriptURL}?user_id=${userId}&cards=${encodeURIComponent(cardsString)}`, { 
                    mode: 'no-cors' 
                });
                
                status.innerText = "Данные переданы!";
                setTimeout(() => { tg.close(); }, 600);

            } catch (error) {
                status.innerText = "Ошибка. Попробуйте еще раз.";
                confirmBtn.disabled = false;
                confirmBtn.innerText = "ПОДТВЕРДИТЬ";
                grid.style.pointerEvents = "auto";
            }
        }
    </script>
</body>
</html>
