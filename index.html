<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Таро Расклад</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            background: #1a1a1a; /* Темный фон для атмосферы */
            color: white;
            overflow: hidden;
        }
        h3 { margin-bottom: 20px; font-weight: 300; letter-spacing: 1px; }
        .grid { 
            display: flex; 
            gap: 12px; 
            flex-wrap: wrap; 
            justify-content: center; 
            max-width: 350px; 
        }
        .card { 
            width: 80px; 
            height: 120px; 
            background: #2c2c2c; 
            border: 1px solid #444;
            color: #ccc; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 12px; 
            text-align: center; 
            padding: 5px; 
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .card.selected { 
            background: #4a34db; 
            border-color: #7f6cf5; 
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(127, 108, 245, 0.4);
        }
        .status { margin-top: 20px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <h3 id="title">ВЫБЕРИТЕ 3 КАРТЫ</h3>
    <div class="grid" id="grid"></div>
    <div class="status" id="status"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const names = ["Маг", "Жрица", "Императрица", "Император", "Жрец", "Влюбленные", "Колесница"];
        let selectedCards = [];
        
        const grid = document.getElementById('grid');
        const title = document.getElementById('title');
        const status = document.getElementById('status');

        // Твой URL из Google Apps Script
        const scriptURL = "https://script.google.com/macros/s/AKfycbyD0tPoh7h1YNWAiASIyux-FiQKGO6aZidwS7ltlk991ve1_NGJpoPF46IuUp6maDbJ/exec";

        // Создаем карты
        names.forEach(name => {
            const cardElement = document.createElement('div');
            cardElement.className = 'card';
            cardElement.innerText = "Клеймо Таро"; // Пока заглушка вместо картинки
            
            cardElement.onclick = async () => {
                if (selectedCards.includes(name)) {
                    // Убираем выделение, если нажали повторно
                    selectedCards = selectedCards.filter(item => item !== name);
                    cardElement.classList.remove('selected');
                    cardElement.innerText = "Клеймо Таро";
                } else if (selectedCards.length < 3) {
                    // Добавляем карту
                    selectedCards.push(name);
                    cardElement.classList.add('selected');
                    cardElement.innerText = name; // Показываем название при выборе

                    // Если выбрали 3 — сразу отправляем
                    if (selectedCards.length === 3) {
                        await sendData();
                    }
                }
            };
            grid.appendChild(cardElement);
        });

        async function sendData() {
            const userId = tg.initDataUnsafe?.user?.id || "test_user";
            const cardsString = selectedCards.join(", ");
            
            title.innerText = "КАРТЫ ВЫБРАНЫ";
            status.innerText = "Передаем ответ боту...";
            
            // Блокируем клики, чтобы не нажали лишнего
            grid.style.pointerEvents = "none";

            try {
                // Отправляем данные в Google Script
                await fetch(`${scriptURL}?user_id=${userId}&cards=${encodeURIComponent(cardsString)}`, { 
                    mode: 'no-cors' 
                });
                
                status.innerText = "Успешно! Возвращаемся в чат...";
                
                // Закрываем через полсекунды, чтобы пользователь увидел успех
                setTimeout(() => {
                    tg.close();
                }, 800);

            } catch (error) {
                console.error(error);
                status.innerText = "Ошибка связи. Попробуйте еще раз.";
                grid.style.pointerEvents = "auto";
            }
        }
    </script>
</body>
</html>
