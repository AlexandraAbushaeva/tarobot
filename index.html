<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Таро Расклад</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h3 {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin: 10px 0;
            text-transform: uppercase;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        /* Сетка 3 + 2 */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            grid-template-rows: repeat(2, 150px);
            gap: 12px;
            justify-content: center;
            perspective: 1000px;
        }

        /* Центрируем последние 2 карты во втором ряду */
        .card-container:nth-child(4) { grid-column: 1 / 2; margin-left: 50px; }
        .card-container:nth-child(5) { grid-column: 2 / 3; margin-left: 50px; }

        .card-container {
            width: 90px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card-container.flipped {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .card-front {
            background: url('back.jpg') no-repeat center center;
            background-size: cover;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #000;
            background-size: cover;
            background-position: center;
            border: 2px solid gold;
            display: flex;
            align-items: flex-end;
        }

        .card-name-tag {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 9px;
            width: 100%;
            text-align: center;
            padding: 4px 0;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        #confirm-btn {
            display: none;
            margin-top: 25px;
            padding: 15px 45px;
            background: linear-gradient(135deg, #6e45e2 0%, #a485ff 100%);
            border: none;
            color: white;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(110, 69, 226, 0.5);
        }

        .locked { opacity: 0.5; pointer-events: none; filter: grayscale(0.5); }
    </style>
</head>
<body>

    <h3 id="title">Выберите 3 карты</h3>
    <div class="grid" id="grid"></div>
    <button id="confirm-btn">ПОДТВЕРДИТЬ ВЫБОР</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Полная колода 78 карт
        const deck = [
            // Старшие Арканы
            { name: "Шут", img: "https://upload.wikimedia.org/wikipedia/commons/9/90/RWS_Tarot_00_Fool.jpg" },
            { name: "Маг", img: "https://upload.wikimedia.org/wikipedia/commons/d/de/RWS_Tarot_01_Magician.jpg" },
            { name: "Жрица", img: "https://upload.wikimedia.org/wikipedia/commons/8/88/RWS_Tarot_02_High_Priestess.jpg" },
            { name: "Императрица", img: "https://upload.wikimedia.org/wikipedia/commons/a/af/RWS_Tarot_03_Empress.jpg" },
            { name: "Император", img: "https://upload.wikimedia.org/wikipedia/commons/c/c3/RWS_Tarot_04_Emperor.jpg" },
            { name: "Иерофант", img: "https://upload.wikimedia.org/wikipedia/commons/8/8d/RWS_Tarot_05_Hierophant.jpg" },
            { name: "Влюбленные", img: "https://upload.wikimedia.org/wikipedia/commons/3/3a/RWS_Tarot_06_Lovers.jpg" },
            { name: "Колесница", img: "https://upload.wikimedia.org/wikipedia/commons/9/9b/RWS_Tarot_07_Chariot.jpg" },
            { name: "Сила", img: "https://upload.wikimedia.org/wikipedia/commons/f/f5/RWS_Tarot_08_Strength.jpg" },
            { name: "Отшельник", img: "https://upload.wikimedia.org/wikipedia/commons/4/4d/RWS_Tarot_09_Hermit.jpg" },
            { name: "Колесо Фортуны", img: "https://upload.wikimedia.org/wikipedia/commons/3/3c/RWS_Tarot_10_Wheel_of_Fortune.jpg" },
            { name: "Справедливость", img: "https://upload.wikimedia.org/wikipedia/commons/e/e0/RWS_Tarot_11_Justice.jpg" },
            { name: "Повешенный", img: "https://upload.wikimedia.org/wikipedia/commons/2/2b/RWS_Tarot_12_Hanged_Man.jpg" },
            { name: "Смерть", img: "https://upload.wikimedia.org/wikipedia/commons/d/d7/RWS_Tarot_13_Death.jpg" },
            { name: "Умеренность", img: "https://upload.wikimedia.org/wikipedia/commons/f/f8/RWS_Tarot_14_Temperance.jpg" },
            { name: "Дьявол", img: "https://upload.wikimedia.org/wikipedia/commons/5/55/RWS_Tarot_15_Devil.jpg" },
            { name: "Башня", img: "https://upload.wikimedia.org/wikipedia/commons/5/53/RWS_Tarot_16_Tower.jpg" },
            { name: "Звезда", img: "https://upload.wikimedia.org/wikipedia/commons/d/db/RWS_Tarot_17_Star.jpg" },
            { name: "Луна", img: "https://upload.wikimedia.org/wikipedia/commons/f/f7/RWS_Tarot_18_Moon.jpg" },
            { name: "Солнце", img: "https://upload.wikimedia.org/wikipedia/commons/1/17/RWS_Tarot_19_Sun.jpg" },
            { name: "Суд", img: "https://upload.wikimedia.org/wikipedia/commons/d/dd/RWS_Tarot_20_Judgement.jpg" },
            { name: "Мир", img: "https://upload.wikimedia.org/wikipedia/commons/f/ff/RWS_Tarot_21_World.jpg" }
        ];

        // Авто-генерация Младших Арканов (чтобы не писать 56 строк вручную)
        const suits = [
            { id: "Wands", ru: "Жезлов" }, { id: "Cups", ru: "Кубков" }, 
            { id: "Swords", ru: "Мечей" }, { id: "Pents", ru: "Пентаклей" }
        ];
        const names = ["Туз", "2", "3", "4", "5", "6", "7", "8", "9", "10", "Паж", "Рыцарь", "Королева", "Король"];

        suits.forEach(suit => {
            names.forEach((name, index) => {
                let num = (index + 1).toString().padStart(2, '0');
                let wikiName = (index === 0) ? "Ace" : (index === 10) ? "Page" : (index === 11) ? "Knight" : (index === 12) ? "Queen" : (index === 13) ? "King" : (index + 1);
                let suitName = (suit.id === "Pents") ? "Pentacles" : suit.id;
                
                deck.push({
                    name: `${name} ${suit.ru}`,
                    img: `https://raw.githubusercontent.com/everget/tarot-data/master/cards/${suit.id.toLowerCase()}${num}.jpg`
                });
            });
        });

        // Выбираем 5 случайных карт
        const shuffled = deck.sort(() => 0.5 - Math.random()).slice(0, 5);
        let selected = [];
        const grid = document.getElementById('grid');
        const btn = document.getElementById('confirm-btn');
        const scriptURL = "https://script.google.com/macros/s/AKfycbwlBfanHKtJXvbdx9JvdLyLfbpoxbfi0J0PKDhTsn6S8shDXXcuHLuDnxDsyLJAWp7gbA/exec";

        // Очистка при загрузке
        window.onload = () => {
            const userId = tg.initDataUnsafe?.user?.id || "test_user";
            fetch(`${scriptURL}?user_id=${userId}&action=clear`, { mode: 'no-cors' });
        };

        shuffled.forEach(card => {
            const container = document.createElement('div');
            container.className = 'card-container';
            container.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-face card-back" style="background-image: url('${card.img}')">
                    <div class="card-name-tag">${card.name}</div>
                </div>
            `;

            container.onclick = () => {
                if (selected.length < 3 && !container.classList.contains('flipped')) {
                    container.classList.add('flipped');
                    selected.push(card.name);
                    if (selected.length === 3) {
                        btn.style.display = 'block';
                        document.querySelectorAll('.card-container:not(.flipped)').forEach(c => c.classList.add('locked'));
                    }
                }
            };
            grid.appendChild(container);
        });

        btn.onclick = async () => {
            btn.disabled = true;
            btn.innerText = "ОТПРАВЛЯЕМ...";
            const userId = tg.initDataUnsafe?.user?.id || "test_user";
            await fetch(`${scriptURL}?user_id=${userId}&cards=${encodeURIComponent(selected.join(", "))}`, { mode: 'no-cors' });
            tg.close();
        };
    </script>
</body>
</html>
