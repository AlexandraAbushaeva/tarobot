<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Таро Расклад</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h3 {
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Сетка 3 сверху, 2 снизу */
        .grid {
            display: grid;
            grid-template-columns: repeat(6, 45px); /* Тонкая сетка для выравнивания */
            gap: 15px 10px;
            justify-content: center;
        }

        .card-container {
            width: 90px;
            height: 150px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
            grid-column: span 2;
        }

        /* Выравнивание 2-го ряда (карты 4 и 5) */
        .card-container:nth-child(4) { grid-column: 2 / 4; }
        .card-container:nth-child(5) { grid-column: 4 / 6; }

        .card-container.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .card-front {
            background: url('back.jpg') no-repeat center center;
            background-size: cover;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #000;
            background-size: cover;
            background-position: center;
            border: 2px solid gold;
            display: flex;
            align-items: flex-end;
        }

        .card-name-tag {
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            font-size: 10px;
            width: 100%;
            text-align: center;
            padding: 5px 0;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        #confirm-btn {
            display: none;
            margin-top: 30px;
            padding: 15px 50px;
            background: linear-gradient(135deg, #6e45e2 0%, #a485ff 100%);
            border: none;
            color: white;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(110, 69, 226, 0.5);
        }

        .locked { opacity: 0.5; pointer-events: none; filter: grayscale(0.5); }
    </style>
</head>
<body>

    <h3>ВЫБЕРИТЕ 3 КАРТЫ</h3>
    <div class="grid" id="grid"></div>
    <button id="confirm-btn">ПОДТВЕРДИТЬ ВЫБОР</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const base = "https://upload.wikimedia.org/wikipedia/commons/";
        
        // Массив всех 78 карт с проверенными ссылками Википедии
        const deck = [
            { name: "Шут", img: "9/90/RWS_Tarot_00_Fool.jpg" },
            { name: "Маг", img: "d/de/RWS_Tarot_01_Magician.jpg" },
            { name: "Жрица", img: "8/88/RWS_Tarot_02_High_Priestess.jpg" },
            { name: "Императрица", img: "a/af/RWS_Tarot_03_Empress.jpg" },
            { name: "Император", img: "c/c3/RWS_Tarot_04_Emperor.jpg" },
            { name: "Иерофант", img: "8/8d/RWS_Tarot_05_Hierophant.jpg" },
            { name: "Влюбленные", img: "3/3a/RWS_Tarot_06_Lovers.jpg" },
            { name: "Колесница", img: "9/9b/RWS_Tarot_07_Chariot.jpg" },
            { name: "Сила", img: "f/f5/RWS_Tarot_08_Strength.jpg" },
            { name: "Отшельник", img: "4/4d/RWS_Tarot_09_Hermit.jpg" },
            { name: "Колесо Фортуны", img: "3/3c/RWS_Tarot_10_Wheel_of_Fortune.jpg" },
            { name: "Справедливость", img: "e/e0/RWS_Tarot_11_Justice.jpg" },
            { name: "Повешенный", img: "2/2b/RWS_Tarot_12_Hanged_Man.jpg" },
            { name: "Смерть", img: "d/d7/RWS_Tarot_13_Death.jpg" },
            { name: "Умеренность", img: "f/f8/RWS_Tarot_14_Temperance.jpg" },
            { name: "Дьявол", img: "5/55/RWS_Tarot_15_Devil.jpg" },
            { name: "Башня", img: "5/53/RWS_Tarot_16_Tower.jpg" },
            { name: "Звезда", img: "d/db/RWS_Tarot_17_Star.jpg" },
            { name: "Луна", img: "f/f7/RWS_Tarot_18_Moon.jpg" },
            { name: "Солнце", img: "1/17/RWS_Tarot_19_Sun.jpg" },
            { name: "Суд", img: "d/dd/RWS_Tarot_20_Judgement.jpg" },
            { name: "Мир", img: "f/ff/RWS_Tarot_21_World.jpg" }
        ];

        // Добавляем Младшие Арканы (Жезлы, Кубки, Мечи, Пентакли)
        const suits = [
            { id: "Wands", ru: "Жезлов", paths: ["1/11/Tarot_Cards_-_Ace_of_Wands.jpg", "0/0f/Tarot_Cards_-_2_of_Wands.jpg", "f/ff/Tarot_Cards_-_3_of_Wands.jpg", "a/a4/Tarot_Cards_-_4_of_Wands.jpg", "9/9d/Tarot_Cards_-_5_of_Wands.jpg", "3/3b/Tarot_Cards_-_6_of_Wands.jpg", "e/e4/Tarot_Cards_-_7_of_Wands.jpg", "6/6b/Tarot_Cards_-_8_of_Wands.jpg", "4/4d/Tarot_Cards_-_9_of_Wands.jpg", "0/0b/Tarot_Cards_-_10_of_Wands.jpg", "6/6a/Tarot_Cards_-_Page_of_Wands.jpg", "1/16/Tarot_Cards_-_Knight_of_Wands.jpg", "0/0d/Tarot_Cards_-_Queen_of_Wands.jpg", "c/ce/Tarot_Cards_-_King_of_Wands.jpg"] },
            { id: "Cups", ru: "Кубков", paths: ["3/36/Tarot_Cards_-_Ace_of_Cups.jpg", "f/f8/Tarot_Cards_-_2_of_Cups.jpg", "3/39/Tarot_Cards_-_3_of_Cups.jpg", "3/35/Tarot_Cards_-_4_of_Cups.jpg", "d/d7/Tarot_Cards_-_5_of_Cups.jpg", "1/17/Tarot_Cards_-_6_of_Cups.jpg", "a/ae/Tarot_Cards_-_7_of_Cups.jpg", "6/60/Tarot_Cards_-_8_of_Cups.jpg", "2/24/Tarot_Cards_-_9_of_Cups.jpg", "8/84/Tarot_Cards_-_10_of_Cups.jpg", "a/ad/Tarot_Cards_-_Page_of_Cups.jpg", "f/fa/Tarot_Cards_-_Knight_of_Cups.jpg", "6/62/Tarot_Cards_-_Queen_of_Cups.jpg", "0/04/Tarot_Cards_-_King_of_Cups.jpg"] },
            { id: "Swords", ru: "Мечей", paths: ["1/1a/Tarot_Cards_-_Ace_of_Swords.jpg", "9/9e/Tarot_Cards_-_2_of_Swords.jpg", "0/02/Tarot_Cards_-_3_of_Swords.jpg", "b/bf/Tarot_Cards_-_4_of_Swords.jpg", "2/23/Tarot_Cards_-_5_of_Swords.jpg", "2/29/Tarot_Cards_-_6_of_Swords.jpg", "3/34/Tarot_Cards_-_7_of_Swords.jpg", "a/a7/Tarot_Cards_-_8_of_Swords.jpg", "2/2f/Tarot_Cards_-_9_of_Swords.jpg", "d/d4/Tarot_Cards_-_10_of_Swords.jpg", "4/4c/Tarot_Cards_-_Page_of_Swords.jpg", "b/b0/Tarot_Cards_-_Knight_of_Swords.jpg", "d/d4/Tarot_Cards_-_Queen_of_Swords.jpg", "3/33/Tarot_Cards_-_King_of_Swords.jpg"] },
            { id: "Pents", ru: "Пентаклей", paths: ["f/fd/Tarot_Cards_-_Ace_of_Pentacles.jpg", "9/9f/Tarot_Cards_-_2_of_Pentacles.jpg", "4/42/Tarot_Cards_-_3_of_Pentacles.jpg", "3/35/Tarot_Cards_-_4_of_Pentacles.jpg", "9/96/Tarot_Cards_-_5_of_Pentacles.jpg", "a/a6/Tarot_Cards_-_6_of_Pentacles.jpg", "8/8a/Tarot_Cards_-_7_of_Pentacles.jpg", "4/49/Tarot_Cards_-_8_of_Pentacles.jpg", "f/f0/Tarot_Cards_-_9_of_Pentacles.jpg", "3/3f/Tarot_Cards_-_10_of_Pentacles.jpg", "e/ec/Tarot_Cards_-_Page_of_Pentacles.jpg", "d/d5/Tarot_Cards_-_Knight_of_Pentacles.jpg", "8/88/Tarot_Cards_-_Queen_of_Pentacles.jpg", "1/1c/Tarot_Cards_-_King_of_Pentacles.jpg"] }
        ];

        const names = ["Туз", "2", "3", "4", "5", "6", "7", "8", "9", "10", "Паж", "Рыцарь", "Королева", "Король"];

        suits.forEach(suit => {
            suit.paths.forEach((path, i) => {
                deck.push({ name: `${names[i]} ${suit.ru}`, img: path });
            });
        });

        // 5 случайных карт
        const shuffled = deck.sort(() => 0.5 - Math.random()).slice(0, 5);
        let selected = [];
        const grid = document.getElementById('grid');
        const btn = document.getElementById('confirm-btn');

        shuffled.forEach(card => {
            const container = document.createElement('div');
            container.className = 'card-container';
            container.innerHTML = `
                <div class="card-face card-front"></div>
                <div class="card-face card-back" style="background-image: url('${base + card.img}')">
                    <div class="card-name-tag">${card.name}</div>
                </div>
            `;
            container.onclick = () => {
                if (selected.length < 3 && !container.classList.contains('flipped')) {
                    container.classList.add('flipped');
                    selected.push(card.name);
                    if (selected.length === 3) {
                        btn.style.display = 'block';
                        document.querySelectorAll('.card-container:not(.flipped)').forEach(c => c.classList.add('locked'));
                    }
                }
            };
            grid.appendChild(container);
        });

        btn.onclick = async () => {
            btn.disabled = true;
            btn.innerText = "СОХРАНЯЕМ...";
            const userId = tg.initDataUnsafe?.user?.id || "test_user";
            const scriptURL = "https://script.google.com/macros/s/AKfycbyD0tPoh7h1YNWAiASIyux-FiQKGO6aZidwS7ltlk991ve1_NGJpoPF46IuUp6maDbJ/exec";
            await fetch(`${scriptURL}?user_id=${userId}&cards=${encodeURIComponent(selected.join(", "))}`, { mode: 'no-cors' });
            tg.close();
        };
    </script>
</body>
</html>
