<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Таро Выбор</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: #111; color: white; text-align: center; margin: 0; padding: 20px;
            user-select: none;
        }
        h3 { font-weight: 300; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 30px; }
        
        /* Сетка как на вашем скриншоте */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 15px; 
            max-width: 350px; 
            margin: 0 auto; 
        }
        .card { 
            aspect-ratio: 2/3;
            background: #222; 
            border: 1px solid #444; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            cursor: pointer; 
            transition: all 0.2s ease; 
            font-size: 10px;
            color: #666;
            padding: 5px;
        }
        .card.selected { 
            border-color: #d4af37; /* Золотистый цвет выбора */
            background: #333; 
            transform: translateY(-5px); 
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3);
            color: #d4af37;
        }
        /* Центрируем последнюю (7-ю) карту */
        .card:nth-child(7) {
            grid-column: 2;
        }

        #confirm-btn { 
            margin-top: 40px; 
            padding: 15px 40px; 
            background: #d4af37; 
            color: black; 
            border: none; 
            border-radius: 25px; 
            display: none; 
            font-weight: bold; 
            width: 80%; 
            max-width: 250px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h3>Выберите 3 карты</h3>
    <div class="grid" id="deck"></div>
    <button id="confirm-btn">ПОДТВЕРДИТЬ</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        const deck = document.getElementById('deck');
        const confirmBtn = document.getElementById('confirm-btn');
        const urlParams = new URLSearchParams(window.location.search);
        
        // Получаем ID пользователя из ссылки
        const userId = urlParams.get('user_id'); 
        
        let selectedCards = [];

        // Создаем 7 карт
        for (let i = 1; i <= 7; i++) {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerText = 'Клеймо Таро';
            card.onclick = () => toggleCard(i, card);
            deck.appendChild(card);
        }

        function toggleCard(id, element) {
            if (selectedCards.includes(id)) {
                selectedCards = selectedCards.filter(item => item !== id);
                element.classList.remove('selected');
            } else if (selectedCards.length < 3) {
                selectedCards.push(id);
                element.classList.add('selected');
            }
            
            // Показываем кнопку только когда выбрано 3 карты
            confirmBtn.style.display = selectedCards.length === 3 ? 'inline-block' : 'none';
        }

        confirmBtn.onclick = () => {
            // --- НАСТРОЙКИ API LEADCONVERTER ---
            const apiToken = "LlIKUY9au0k9VCkP9RX8NqyU5Xu370Ua"; // ВСТАВЬТЕ СЮДА ВАШ ТОКЕН
            const variableName = "selected_cards"; 
            const value = selectedCards.join(','); 

            // Если userId не найден, пробуем взять его из данных Telegram
            const finalUserId = userId || (tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null);

            if (!finalUserId) {
                tg.showAlert("Ошибка: ID пользователя не найден");
                return;
            }

            // Отправка запроса в LeadConverter
            fetch(`https://leadconverter.ru/api/v1/${apiToken}/contact.set_variable`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: finalUserId,
                    name: variableName,
                    value: value
                })
            })
            .then(response => {
                if (response.ok) {
                    tg.showAlert("Карты выбраны, возвращайтесь в бот!");
                    tg.close(); 
                } else {
                    tg.showAlert("Ошибка API. Проверьте токен.");
                }
            })
            .catch(err => {
                tg.showAlert("Ошибка сети: " + err);
            });
        };
    </script>
</body>
</html>
